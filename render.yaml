services:
  - type: web
    name: portfolio-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: pnpm install --frozen-lockfile=false && pnpm --filter api run build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/v1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRY
        value: 7d
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_USERNAME
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://ihsanramadhan.my.id
